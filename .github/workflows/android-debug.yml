name: LifeCity Android Debug

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/android-debug.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Import project
        working-directory: godot
        run: godot --headless --editor --quit

      - name: Build APK
        working-directory: godot
        run: |
          mkdir -p ../build/android
          godot --headless --verbose --export-debug "Android Debug" ../build/android/LifeCity-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeCity-debug-apk
          path: build/android/LifeCity-debug.apk
