name: LifeCity Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable; fi

      - name: Check project
        run: |
          cd playable3d
          godot --headless --check-only --path .

      - name: Build Android debug APK
        run: |
          mkdir -p build/android
          cd playable3d
          godot --headless --verbose --export-debug "Android Debug" "../build/android/LifeCity-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeCity-Android-debug
          path: build/android/LifeCity-debug.apk
          retention-days: 14
