name: LifeCity Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check project
        run: godot --headless --check-only --path playable3d

      - name: Build Android debug APK
        run: |
          mkdir -p build/android
          cd playable3d
          godot --headless --verbose --export-debug "Android Debug" "../build/android/LifeCity-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeCity-Android-debug
          path: build/android/LifeCity-debug.apk
          retention-days: 14
